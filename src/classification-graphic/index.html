<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classification Graphic — FDL Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,700&family=Roboto+Condensed:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <nav class="topnav">
    <a href="../../index.html" class="home-btn">FDL Tools</a>
  </nav>

  <div class="page-wrapper">

    <header class="pg-header">
      <div class="pg-header__label">FDL CLASSIFICATION GENERATOR</div>
    </header>

    <!-- Card 1: Graphic Details -->
    <div class="gc-card">
      <div class="gc-section-label">GRAPHIC DETAILS</div>

      <div class="row-round-track">
        <div class="fg">
          <label class="label" for="round-number">Round #</label>
          <input type="number" id="round-number" class="input-field" min="1" max="20" value="4">
        </div>
        <div class="fg">
          <label class="label" for="track-name">Track Name</label>
          <input type="text" id="track-name" class="input-field" placeholder="e.g. Virginia" value="Watkins Glen">
        </div>
      </div>

      <div class="fg mt-14">
        <label class="label" for="series-label">Series Label</label>
        <input type="text" id="series-label" class="input-field" placeholder="e.g. SFL" value="SFL">
      </div>

      <div class="fg mt-14">
        <label class="label" for="session-type">Session Type</label>
        <select id="session-type" class="input-field">
          <option value="race">Race</option>
          <option value="qualify">Qualifying</option>
          <option value="practice" selected>Practice</option>
        </select>
      </div>

      <div class="row-flag-session mt-14">
        <div class="fg">
          <label class="label">Country Flag</label>
          <div class="flag-dropdown" id="flag-dropdown">
            <div class="flag-trigger" id="flag-trigger" tabindex="0" role="button" aria-haspopup="listbox">
              <span class="flag-trigger__code" id="flag-trigger-code"></span>
              <span class="flag-trigger__name" id="flag-trigger-name"></span>
              <span class="flag-trigger__chevron" aria-hidden="true">▼</span>
            </div>
            <div class="flag-panel" id="flag-panel" role="listbox">
              <input type="text" class="flag-search" id="flag-search" placeholder="Search country..." autocomplete="off">
              <div class="flag-list" id="flag-list"></div>
            </div>
          </div>
        </div>
        <div class="fg">
          <label class="label" for="subsession-id">Subsession ID</label>
          <input type="text" id="subsession-id" class="input-field" placeholder="Auto from CSV">
        </div>
      </div>

      <div class="fg mt-14">
        <label class="label" for="csv-upload">Results CSV</label>
        <input type="file" id="csv-upload" class="input-field" accept=".csv">
      </div>

      <button class="generate-btn mt-14" id="generate-btn">GENERATE GRAPHIC</button>
    </div>

    <!-- Card 2: Export -->
    <div class="gc-card" id="export-card" style="display:none">
      <div class="gc-section-label">EXPORT</div>

      <div class="graphic-wrap">
        <div id="graphic">
          <div class="bg-photo" id="bg-photo"></div>
          <div class="bg-overlay"></div>
          <div class="bg-vignette"></div>
          <div class="g-content">
            <img class="g-logo" id="g-logo" alt="FDL">
            <div class="g-round-title" id="g-round-title"></div>
            <div class="g-subtitle" id="g-subtitle"></div>
            <div class="g-table-wrap">
              <table id="g-table"></table>
            </div>
            <div class="g-footer">
              <img class="g-footer__logo" id="logo-gripline" alt="Gripline">
              <img class="g-footer__logo" id="logo-es" alt="Everything Simulated">
            </div>
          </div>
        </div>
      </div>

      <div class="export-btns">
        <button class="export-btn export-btn--primary" id="download-btn">Download JPG</button>
        <button class="export-btn" id="copy-btn">Copy to Clipboard</button>
      </div>

      <div class="gc-section-label" style="margin-top:24px">DISCORD TEXT</div>
      <textarea class="discord-textarea" id="discord-text" readonly spellcheck="false"></textarea>
      <button class="export-btn export-btn--primary" id="copy-text-btn" style="margin-top:10px">Copy Text</button>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="../../data/assets.js"></script>
  <script src="../../data/drivers.js"></script>
  <script src="./index.js"></script>
</body>
</html>
