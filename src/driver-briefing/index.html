<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Briefing — FDL Tools</title>
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <nav class="topnav">
    <a href="../../index.html" class="home-btn">FDL Tools</a>
  </nav>

  <div class="page-wrapper">

    <header class="page-header">
      <div class="page-header__label">SFL Discord Template Builder</div>
      <h1 class="page-header__title">Driver Briefing</h1>
    </header>

    <!-- Card 1: Race Details -->
    <div class="card">
      <div class="section-title">RACE DETAILS</div>

      <div class="grid-round-track">
        <div class="form-group">
          <label class="label" for="round-number">Round #</label>
          <input type="number" id="round-number" class="input-field" min="1" max="20" value="1">
        </div>
        <div class="form-group">
          <label class="label" for="track-name">Track Name</label>
          <input type="text" id="track-name" class="input-field" placeholder="e.g. Watkins Glen">
        </div>
      </div>

      <div class="form-group">
        <label class="label">Country Flag</label>
        <div class="flag-dropdown" id="flag-dropdown">
          <div class="flag-trigger" id="flag-trigger" tabindex="0" role="button" aria-haspopup="listbox">
            <span class="flag-trigger__code" id="flag-trigger-code"></span>
            <span class="flag-trigger__name" id="flag-trigger-name"></span>
            <span class="flag-trigger__chevron" aria-hidden="true">▼</span>
          </div>
          <div class="flag-panel" id="flag-panel" role="listbox">
            <input type="text" class="flag-search" id="flag-search" placeholder="Search country..." autocomplete="off">
            <div class="flag-list" id="flag-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 2: Warnings -->
    <div class="card">
      <div class="section-title">WARNINGS</div>
      <div id="warnings-list"></div>
      <button class="add-warning-btn" id="add-warning-btn">+ Add Warning</button>
    </div>

    <!-- Card 3: Output -->
    <div class="card">
      <div class="section-title">DISCORD OUTPUT</div>
      <div class="raw-output" id="raw-output"></div>
      <button class="copy-btn" id="copy-btn">Copy to Clipboard</button>
    </div>

  </div>

  <script src="./index.js"></script>
</body>
</html>
