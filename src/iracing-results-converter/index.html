<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iRacing Results Converter — FDL Tools</title>
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <nav class="topnav">
    <a href="../../index.html" class="home-btn">FDL Tools</a>
  </nav>

  <div class="page-wrapper">

    <header class="page-header">
      <div class="page-header__label">SFL Tools</div>
      <h1 class="page-header__title">iRacing Results Converter</h1>
    </header>

    <!-- Upload card -->
    <div class="card">
      <div class="section-title">UPLOAD RESULTS</div>
      <div class="drop-zone" id="drop-zone">
        <div class="drop-zone__icon">📄</div>
        <div class="drop-zone__title">Drop your iRacing CSV here</div>
        <div class="drop-zone__hint">or <span>click to browse</span></div>
      </div>
      <div class="error-bar" id="error-bar"></div>
      <input type="file" id="file-input" accept=".csv,.txt">
    </div>

    <!-- Highlights -->
    <div class="results-section" id="highlights-section">
      <div class="highlights">
        <div class="highlight-card">
          <div class="highlight-card__badge">⚡ Fastest Lap</div>
          <div class="highlight-card__value" id="hl-fastest-time">—</div>
          <div class="highlight-card__sub" id="hl-fastest-name"></div>
        </div>
        <div class="highlight-card">
          <div class="highlight-card__badge">🥇 Pole Position</div>
          <div class="highlight-card__value" id="hl-pole-name">—</div>
          <div class="highlight-card__sub" id="hl-pole-time"></div>
        </div>
      </div>
    </div>

    <!-- Output card -->
    <div class="card results-section" id="output-section">
      <div class="section-title">TAB-SEPARATED OUTPUT</div>
      <div class="output-header">
        <div class="output-meta">
          <span id="output-count">0</span> drivers &mdash; paste directly into Google Sheets
        </div>
        <button class="copy-btn" id="copy-btn" disabled>Copy to Clipboard</button>
      </div>
      <textarea class="output-textarea" id="output-textarea" readonly spellcheck="false"></textarea>
    </div>

  </div>

  <script src="./index.js"></script>
</body>
</html>
