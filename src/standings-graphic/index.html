<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings Graphic — FDL Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,700&family=Roboto+Condensed:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <nav class="topnav">
    <a href="../../index.html" class="home-btn">FDL Tools</a>
  </nav>

  <div class="page-wrapper">

    <header class="pg-header">
      <div class="pg-header__label">FDL STANDINGS GENERATOR</div>
    </header>

    <!-- Card 1: Graphic Details -->
    <div class="gc-card">
      <div class="gc-section-label">GRAPHIC DETAILS</div>

      <div class="row-round-track">
        <div class="fg">
          <label class="label" for="round-number">Round #</label>
          <input type="number" id="round-number" class="input-field" min="1" max="20" value="5">
        </div>
        <div class="fg">
          <label class="label" for="season-name">Season</label>
          <input type="text" id="season-name" class="input-field" placeholder="e.g. SFL Championship · FDL Season 6" value="SFL Championship · FDL Season 6">
        </div>
      </div>

      <div class="fg mt-14">
        <label class="label">Points Column</label>
        <div class="toggle-btns">
          <button class="toggle-btn toggle-btn--active" id="btn-drop" data-type="drop">With Drop</button>
          <button class="toggle-btn" id="btn-total" data-type="total">Total</button>
        </div>
      </div>

      <div class="row-cut mt-14">
        <div class="fg">
          <label class="label" for="cut-after">Cut After Pos #</label>
          <input type="number" id="cut-after" class="input-field" min="0" max="30" value="13" placeholder="0 = none">
        </div>
        <div class="fg">
          <label class="label" for="cut-label">Cut Label</label>
          <input type="text" id="cut-label" class="input-field" value="AOWN Cut">
        </div>
      </div>

      <div class="fg mt-14">
        <label class="label" for="standings-data">Standings Data (paste from spreadsheet)</label>
        <textarea id="standings-data" class="input-field standings-paste" rows="6" placeholder="Paste tab-separated standings data here..."></textarea>
      </div>

      <button class="generate-btn mt-14" id="generate-btn">GENERATE GRAPHIC</button>
    </div>

    <!-- Card 2: Export -->
    <div class="gc-card" id="export-card" style="display:none">
      <div class="gc-section-label">EXPORT</div>

      <div class="graphic-wrap">
        <div id="graphic">
          <div class="bg-photo" id="bg-photo"></div>
          <div class="bg-overlay"></div>
          <div class="bg-vignette"></div>
          <div class="g-content">
            <img class="g-logo" id="g-logo" alt="FDL">
            <div class="g-round-title" id="g-round-title"></div>
            <div class="g-subtitle" id="g-subtitle"></div>
            <div class="g-table-wrap">
              <table id="g-table"></table>
            </div>
            <div class="g-footer">
              <img class="g-footer__logo" id="logo-gripline" alt="Gripline">
              <img class="g-footer__logo" id="logo-es" alt="Everything Simulated">
            </div>
          </div>
        </div>
      </div>

      <div class="export-btns">
        <button class="export-btn export-btn--primary" id="download-btn">Download JPG</button>
        <button class="export-btn" id="copy-btn">Copy to Clipboard</button>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="../../data/drivers.js"></script>
  <script src="./index.js"></script>
</body>
</html>
